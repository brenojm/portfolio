<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#03050a" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Breno Magrani" />

    <!--
      <title>, description e canonical são definidos por página via <Seo />.
      As tags og:*/twitter:* ficam estáticas porque os crawlers de LinkedIn,
      WhatsApp etc. não executam JavaScript. Imagem: `npm run og`.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Breno Magrani" />
    <meta property="og:url" content="https://www.brenomagrani.dev/" />
    <meta property="og:title" content="Breno Magrani | Desenvolvedor de Software" />
    <meta
      property="og:description"
      content="Engenheiro de software focado em Java, microsserviços e sistemas de alta escala — e em levar IA para o dia a dia do desenvolvimento."
    />
    <meta property="og:image" content="https://www.brenomagrani.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Breno Magrani — Engenheiro de Software" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="profile:first_name" content="Breno" />
    <meta property="profile:last_name" content="Magrani" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.brenomagrani.dev/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Breno Magrani",
        "url": "https://www.brenomagrani.dev/",
        "image": "https://avatars.githubusercontent.com/u/102327389?s=400&v=4",
        "jobTitle": "Software Engineer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Petrópolis",
          "addressRegion": "RJ",
          "addressCountry": "BR"
        },
        "knowsAbout": ["Java", "Quarkus", "Spring Boot", "Microservices", "Kafka", "AI Agents"],
        "sameAs": ["https://www.linkedin.com/in/brenomagrani/", "https://github.com/brenojm"]
      }
    </script>
    <!-- Aplica o tema antes da primeira pintura para evitar flash -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este site precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
