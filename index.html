<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#03050a" media="(prefers-color-scheme: dark)" />
    <!-- description e <title> são definidos por página via <Seo />; og:* fica estático porque crawlers sociais não executam JS -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Breno Magrani" />
    <meta
      property="og:description"
      content="Portfólio, experiência profissional e publicações de Breno Magrani."
    />
    <!-- Aplica o tema antes da primeira pintura para evitar flash -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este site precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
