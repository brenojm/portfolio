<!doctype html>
<!--
  Template da imagem de prévia (Open Graph, 1200×630).
  Regenerar: npm run og  → escreve public/og.png
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #03050a;
      }
      body {
        position: relative;
        font-family: 'Geist', sans-serif;
        color: #f2f4f8;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .streams {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .glow {
        position: absolute;
        width: 700px;
        height: 700px;
        right: -180px;
        top: -220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(77, 141, 255, 0.28), transparent 65%);
      }
      .content {
        position: relative;
        z-index: 1;
      }
      .mark {
        width: 92px;
        height: 86px;
        filter: drop-shadow(0 0 28px rgba(77, 141, 255, 0.55));
      }
      h1 {
        margin-top: 40px;
        font-size: 128px;
        line-height: 0.92;
        font-weight: 600;
        letter-spacing: -0.055em;
        background: linear-gradient(180deg, #f2f4f8 35%, rgba(242, 244, 248, 0.55));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role {
        margin-top: 28px;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #a3abbd;
      }
      .role b {
        font-weight: 500;
        background: linear-gradient(110deg, #4d8dff, #38d6f5);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .footer {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        font-family: 'Geist Mono', monospace;
        font-size: 22px;
        letter-spacing: 0.08em;
        color: #7d869a;
      }
      .footer span:first-child {
        color: #4d8dff;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <svg class="streams" viewBox="0 0 1200 630" fill="none" id="streams"></svg>

    <div class="content">
      <svg
        class="mark"
        viewBox="0 0 34 32"
        fill="none"
        stroke="url(#g)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4d8dff" />
            <stop offset="1" stop-color="#38d6f5" />
          </linearGradient>
        </defs>
        <path d="M10 7 L3 16 L10 25" />
        <path d="M19.5 4 L14.5 28" />
        <path d="M24 7 L31 16 L24 25" />
      </svg>
      <h1>Breno Magrani</h1>
      <p class="role">Engenheiro de Software · <b>Java, Microsserviços &amp; IA</b></p>
    </div>

    <div class="footer">
      <span>&lt;brenomagrani.dev /&gt;</span>
      <span>PETRÓPOLIS · RJ · BRASIL</span>
    </div>

    <script>
      // Mesmas "linhas de fluxo" do hero, estáticas e com semente fixa.
      let seed = 7
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646
      const svg = document.getElementById('streams')
      let html =
        '<defs><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#4d8dff" stop-opacity="0"/><stop offset="0.5" stop-color="#4d8dff"/><stop offset="1" stop-color="#38d6f5"/></linearGradient></defs>'
      for (let i = 0; i < 22; i++) {
        const base = 40 + i * 27
        const amp = 15 + rand() * 40
        const y2 = 315 + (base - 315) * 0.65
        const opacity = 0.08 + (1 - Math.abs(base - 315) / 315) * 0.22
        html += `<path d="M-20 ${base} C 380 ${base - amp}, 760 ${y2 + amp}, 1220 ${y2}" stroke="url(#s)" stroke-opacity="${opacity.toFixed(2)}" stroke-width="1.3"/>`
      }
      for (let i = 0; i < 6; i++) {
        const x = 500 + rand() * 650
        const y = 80 + rand() * 470
        html += `<circle cx="${x}" cy="${y}" r="3" fill="#38d6f5" opacity="0.8"/>`
      }
      svg.innerHTML = html
    </script>
  </body>
</html>
